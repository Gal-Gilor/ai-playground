[app]
# Path to the .pth checkpoint loaded by the FastAPI service for inference.
# Update this after training to point to the desired checkpoint.
model_weights = "data/models/efficientnet_b4_best.pth"

[training]
exploded_labels_csv = "data/exploded_labels.csv" 

[training.unpack_bounding_boxes]
source_labels_csv = "data/labels.csv"     
bounding_boxes_column = "dog_bounding_boxes"               

[training.crop_images]
raw_images_directory = "data/images"         
cropped_images_directory = "data/cropped_images"
cropped_image_labels_csv = "data/cropped_image_labels.csv"  
resize = [380, 380]
source_id_column = "id"
breed_column = "breed"
bounding_boxes_column = "dog_bounding_boxes"
crop_id_column = "crop_id"
output_id_column = "id"

[training.filter_visible_dogs]
cropped_images_directory = "data/cropped_images"
cropped_image_labels_csv = "data/cropped_image_labels.csv"
output_csv = "data/cropped_visible_labels.csv"
model = "gemini-2.5-flash"
rate_limit = 60
max_retries = 5

[training.create_train_split]
train_directory = "data/train"
visible_labels_csv = "data/cropped_visible_labels.csv"
visible_column = "is_visible"

[training.create_test_split]
test_size = 0.2

[training.train_classification_head]
train_directory = "data/train"
output_directory = "data/models"
head_hidden_units = 512
head_dropout_rate = 0.3

# Training hyperparameters
epochs = 15
batch_size = 32
learning_rate = 1e-3
weight_decay = 1e-4

# ImageNet Normalization
normalize_mean = [0.485, 0.456, 0.406]
normalize_std = [0.229, 0.224, 0.225]

# Train-time augmentation
random_horizontal_flip_prob = 0.5
random_rotation_degrees = 15
color_jitter_brightness = 0.2
color_jitter_contrast = 0.2
color_jitter_saturation = 0.2
color_jitter_hue = 0.1
center_crop_size = 380
early_stopping_patience = 5
val_split = 0.1
lr_patience = 2
lr_factor = 0.5
lr_min_lr = 1e-7
label_smoothing = 0.1

[training.finetune_backbone]
# Set checkpoint_path to best.pth from train_classification_head before running.
checkpoint_path = ""
train_directory = "data/train"
output_directory = "data/models"

# Backbone fine-tuning hyperparameters
num_unfrozen_blocks = 2
epochs = 100
batch_size = 16
learning_rate = 1e-4
momentum = 0.9
weight_decay = 1e-4
label_smoothing = 0.1
early_stopping_patience = 5
val_split = 0.1
lr_patience = 2
lr_factor = 0.5
lr_min_lr = 1e-6
